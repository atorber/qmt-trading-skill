[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "qmt-trading-skill"
version = "1.0.0"
description = "Agent Skills：通过 QMT Bridge HTTP API 用自然语言完成行情、交易、复盘与飞书同步"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "qmt-bridge>=2.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
]
docs = [
    "mkdocs>=1.5",
    "mkdocs-material>=9.0",
]

[project.urls]
Homepage = "https://github.com/atorber/qmt-trading-skill"
Repository = "https://github.com/atorber/qmt-trading-skill"
Bridge = "https://github.com/atorber/qmt-bridge"

[tool.hatch.build.targets.sdist]
include = [
    "skills",
    "docs",
    "README.md",
    "LICENSE",
    "pyproject.toml",
]

[tool.hatch.build.targets.wheel]
only-include = ["skills"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
