site_name: QMT Trading Skill
site_description: Agent Skills for QMT Bridge
site_url: !ENV [MKDOCS_SITE_URL, 'http://127.0.0.1:8001/']
repo_url: https://github.com/atorber/qmt-trading-skill
edit_uri: edit/main/docs/

theme:
  name: material
  language: zh
  palette:
    - scheme: default
      primary: indigo

nav:
  - 首页: index.md
  - Agent Skills: agent-skills.md
  - 示例:
      - 每日复盘报告: examples/daily-eval-report.md

markdown_extensions:
  - admonition
  - pymdownx.superfences
  - toc:
      permalink: true
