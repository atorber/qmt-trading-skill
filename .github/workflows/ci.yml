name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install qmt-bridge from submodule and skills
        run: |
          pip install -e "./vendor/qmt-bridge"
          pip install -e ".[dev]"
      - name: Skill tests
        run: python -m pytest tests/ -q
