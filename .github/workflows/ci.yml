name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install qmt-bridge (PyPI) and skills
        run: |
          pip install "qmt-bridge>=2.9.0"
          pip install -e ".[dev]"
      - name: Skill tests
        run: python -m pytest tests/ -q
